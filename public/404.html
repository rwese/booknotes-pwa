<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BookNotes - Loading...</title>
  <script>
    // Get the original pathname
    var path = window.location.pathname;

    // Calculate the base path
    var basePath = '/booknotes-pwa';

    // Strip the base path from the pathname to get just the route
    var routePath = path;
    if (routePath.startsWith(basePath)) {
      routePath = routePath.substring(basePath.length) || '/';
    }

    // If we're on root or base path, redirect to base
    if (routePath === '/' || routePath === '') {
      window.location.href = basePath + '/';
    } else {
      // Redirect to index.html with the route path
      window.location.href = basePath + '/?r=' + encodeURIComponent(routePath);
    }
  </script>
</head>
<body>
  <p>Loading BookNotes...</p>
</body>
</html>
