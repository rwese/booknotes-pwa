<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BookNotes - Loading...</title>
  <script>
    // Get the original pathname
    var path = window.location.pathname;

    // Calculate the base path
    var basePath = '/booknotes-pwa/';

    // Extract the route path (remove base path)
    var routePath = path;

    // If we're on the base path or root, redirect to base
    if (routePath === basePath || routePath === basePath.substring(0, basePath.length - 1)) {
      window.location.href = basePath;
    } else {
      // Redirect to index.html with the route path
      window.location.href = basePath + '?r=' + encodeURIComponent(routePath);
    }
  </script>
</head>
<body>
  <p>Loading BookNotes...</p>
</body>
</html>
