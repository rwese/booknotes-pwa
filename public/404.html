<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BookNotes - Loading...</title>
  <script>
    // SPA redirect for GitHub Pages
    // Store the full path in sessionStorage, then redirect to index.html
    // The app will read sessionStorage and navigate to the correct route
    var path = window.location.pathname;
    var search = window.location.search;
    var hash = window.location.hash;

    // Store everything after the base path
    var basePath = '/booknotes-pwa';
    var routePath = path;
    if (routePath.startsWith(basePath)) {
      routePath = routePath.substring(basePath.length) || '/';
    }

    // Save the route + query + hash for the app to pick up
    sessionStorage.setItem('spa-redirect', routePath + search + hash);

    // Redirect to the app root (clean URL, no ?r= params)
    window.location.replace(basePath + '/');
  </script>
</head>
<body>
  <p>Loading BookNotes...</p>
</body>
</html>
