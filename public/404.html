<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BookNotes - Loading...</title>
  <script>
    // SPA redirect for GitHub Pages
    // Store the path (without base path) in sessionStorage, then redirect to index.html
    // The app will read sessionStorage and navigate to the correct route
    var basePath = '/booknotes-pwa';
    var fullPath = window.location.pathname;
    var search = window.location.search;
    var hash = window.location.hash;

    // Remove base path to get the route
    var routePath = fullPath;
    if (routePath.startsWith(basePath)) {
      routePath = routePath.slice(basePath.length);
    }

    // Ensure route path starts with /
    if (!routePath.startsWith('/') && routePath !== '') {
      routePath = '/' + routePath;
    }

    // If we're already at the root (or base path only), no redirect needed
    if (routePath === '/' || routePath === '') {
      // Just load the app normally
      window.location.replace(basePath + '/');
    } else {
      // Store the route + query + hash for the app to pick up
      sessionStorage.setItem('spa-redirect', routePath + search + hash);

      // Redirect to the app root (clean URL, no ?r= params)
      window.location.replace(basePath + '/');
    }
  </script>
</head>
<body>
  <p>Loading BookNotes...</p>
</body>
</html>
